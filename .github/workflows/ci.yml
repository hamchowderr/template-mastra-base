name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Mastra build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MASTRA_TELEMETRY_DISABLED: '1'
          APP_SECRET: ${{ secrets.CI_APP_SECRET }}
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_ANON_KEY: stub
          SUPABASE_SERVICE_ROLE_KEY: stub
          SUPABASE_DB_URL: postgres://stub:stub@localhost:5432/stub
          ANTHROPIC_API_KEY: stub

  eval:
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      aimock:
        image: ghcr.io/copilotkit/aimock:latest
        ports:
          - 4010:4010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Wait for AIMock
        run: timeout 30 bash -c 'until curl -s http://localhost:4010/ > /dev/null 2>&1; do sleep 1; done'
      - name: Run eval gate
        run: npm run eval
        env:
          USE_AIMOCK: 'true'
          AIMOCK_URL: http://localhost:4010
          MASTRA_TELEMETRY_DISABLED: '1'
          APP_SECRET: ${{ secrets.CI_APP_SECRET }}
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_ANON_KEY: stub
          SUPABASE_SERVICE_ROLE_KEY: stub
          SUPABASE_DB_URL: postgres://stub:stub@localhost:5432/stub
          ANTHROPIC_API_KEY: stub
          OPENAI_API_KEY: stub
          GOOGLE_GENERATIVE_AI_API_KEY: stub
          NODE_ENV: test
          LOG_LEVEL: warn

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: mastra:ci-${{ github.sha }}
